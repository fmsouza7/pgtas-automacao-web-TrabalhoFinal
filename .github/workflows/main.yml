# Pipeline Execução de Testes em Aplicações Web

# nome da pipeline
name: 'Web E2E Tests'

on:
  workflow_dispatch:

jobs:
  e2e-tests:
    # maquina onde o job vai rodar
    runs-on: ubuntu-latest

    # passos do job
    steps:
      # clone do projeto
      - uses: actions/checkout@v4

      # Conferir a versão instalada
      - name: Node version
        run: node --version

      # instalação das dependências
      - name: Instalando dependências
        run: npm install
      
      # execução de testes 
      - name: Executando testes web
        run: npx cypress run
		
      # Upload do relatorio Mochawesome
      - name: Salvando Relatório Mochawesome
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: Relatório Mochawesome
          path: |
            cypress/reports
            cypress/screenshots
